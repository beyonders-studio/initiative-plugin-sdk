name: Publish

# A release is a merge to main that leaves package.json at a version with no
# tag yet: the release pull request the Promote workflow opens. This workflow
# then runs the checks CI runs, tags the version and cuts its GitHub Release,
# and publishes it to npm behind the `npm` environment. Any other push to main
# finds its version already tagged and does nothing.
#
# npm trusts this workflow, in the `npm` environment, as the package's
# publisher (trusted publishing, over GitHub's OIDC token), so no npm token is
# stored, and the package carries provenance naming the commit and workflow
# that built it. Renaming this file or the environment breaks publishing until
# the trusted publisher on npmjs.com names them again.
#
# Tags are no trigger: a tag pushed by hand publishes nothing. Run by hand to
# publish a tag that already exists, such as a release whose publish was
# rejected or failed.
#
# Tag, release and publish live in one workflow on purpose: a tag pushed with
# the workflow's own token starts no other workflow. And it deliberately has
# no concurrency group: a release run is never cancelled by a later push.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "The existing tag to publish (for example v4.1.0)"
        required: true

permissions:
  contents: read

jobs:
  decide:
    name: Decide the release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.decide.outputs.version }}
      ref: ${{ steps.decide.outputs.ref }}
      tag: ${{ steps.decide.outputs.tag }}
      release: ${{ steps.decide.outputs.release }}
      publish: ${{ steps.decide.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Decide the version and what to do
        id: decide
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [[ -n "$TAG" ]]; then
            # By hand: publish a tag that already exists, from its commit.
            if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::tag must be vX.Y.Z."
              exit 1
            fi
            if ! git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
              echo "::error::$TAG is not a tag."
              exit 1
            fi
            ref=$(git rev-list -n 1 "$TAG")
            version="${TAG#v}"
            at_tag=$(git show "$ref:package.json" | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")
            if [[ "$at_tag" != "$version" ]]; then
              echo "::error::package.json at $TAG says $at_tag."
              exit 1
            fi
            release=false
            publish=true
          else
            ref="$GITHUB_SHA"
            version="$(node -p "require('./package.json').version")"
            if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
              echo "v$version is already released; nothing to do"
              release=false
              publish=false
            else
              release=true
              publish=true
            fi
          fi
          {
            echo "version=$version"
            echo "ref=$ref"
            echo "tag=v$version"
            echo "release=$release"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"

  check:
    name: Check
    needs: decide
    if: needs.decide.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.decide.outputs.ref }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      # Without lifecycle scripts, so prepare cannot regenerate what
      # check:generated compares; then what they would have done, in order.
      - run: npm ci --ignore-scripts
      - run: npm run check:generated
      - run: npm rebuild
      - run: npm run prepare
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:command

  github-release:
    name: Tag and GitHub Release
    needs: [decide, check]
    if: needs.decide.outputs.release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.decide.outputs.ref }}
          fetch-depth: 0

      - name: Tag the version
        env:
          TAG: ${{ needs.decide.outputs.tag }}
          REF: ${{ needs.decide.outputs.ref }}
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "$TAG is already tagged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" "$REF" -m "Release $TAG"
          git push origin "$TAG"

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.decide.outputs.tag }}
          VERSION: ${{ needs.decide.outputs.version }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG already has a release"
            exit 0
          fi
          # The version's CHANGELOG section when the repository keeps one,
          # else notes generated from the merged pull requests.
          notes=(--generate-notes)
          if [[ -f CHANGELOG.md ]]; then
            awk -v ver="$VERSION" '
              index($0, "## [" ver "]") == 1 { collecting = 1; next }
              collecting && /^## \[/ { exit }
              collecting { print }
            ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
            if [[ -n "$(tr -d '[:space:]' < "$RUNNER_TEMP/notes.md")" ]]; then
              notes=(--notes-file "$RUNNER_TEMP/notes.md")
            fi
          fi
          gh release create "$TAG" --verify-tag --title "$TAG" "${notes[@]}"

  publish:
    name: Publish to npm
    needs: [decide, check, github-release]
    # After the release on a merge; with no release job when run by hand for
    # an existing tag.
    if: >-
      ${{ !cancelled()
      && needs.decide.outputs.publish == 'true'
      && needs.check.result == 'success'
      && contains(fromJSON('["success", "skipped"]'), needs.github-release.result) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Its required reviewers approve each publish, and npm's trusted publisher
    # names this environment, so only a job in it can publish.
    environment:
      name: npm
      url: https://www.npmjs.com/package/initiative-plugin-sdk/v/${{ needs.decide.outputs.version }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.decide.outputs.ref }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Skip a version npm already has
        id: published
        env:
          VERSION: ${{ needs.decide.outputs.version }}
        run: |
          if [[ "$(npm view "initiative-plugin-sdk@$VERSION" version 2>/dev/null)" == "$VERSION" ]]; then
            echo "initiative-plugin-sdk@$VERSION is already on npm"
            echo "already=true" >> "$GITHUB_OUTPUT"
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi
      # npm ci runs prepare, which generates and builds; publish rebuilds.
      - if: steps.published.outputs.already == 'false'
        run: npm ci
      - if: steps.published.outputs.already == 'false'
        run: npm publish --provenance --access public
