name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      # Without lifecycle scripts: npm ci would run prepare, which regenerates
      # the very files check:generated compares, so the check could never fail.
      - run: npm ci --ignore-scripts
      # The contract is the source; the schema and the types are its output. A
      # contract edited without regenerating fails here rather than shipping a
      # package whose types and schema disagree.
      - run: npm run check:generated
      # What --ignore-scripts skipped: the dependencies' install scripts, then
      # the package's own prepare (generate, a no-op once checked, and build).
      - run: npm rebuild
      - run: npm run prepare
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:command
